name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js icon-192.png icon-512.png www/

      - name: Create Android project
        run: |
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Daily Expenses" com.biaohs.expenses --web-dir www
          npx cap add android

      - name: Add app icon
        run: |
          sudo apt-get install -y imagemagick
          cd android/app/src/main/res
          rm -rf mipmap-anydpi-v26
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}
            convert "$GITHUB_WORKSPACE/icon-only.png" -resize ${s}x${s} mipmap-$n/ic_launcher.png
            cp mipmap-$n/ic_launcher.png mipmap-$n/ic_launcher_round.png
            cp mipmap-$n/ic_launcher.png mipmap-$n/ic_launcher_foreground.png
          done

      - name: Sync web files
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Sign APK with permanent key
        env:
          KS_BASE64: ${{ secrets.KS_BASE64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          if [ -z "$KS_BASE64" ] || [ -z "$KS_PASS" ]; then
            echo "Missing KS_BASE64 or KS_PASS secret. Add both in Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$KS_BASE64" | base64 -d > release.p12
          AS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$AS" sign --ks release.p12 --ks-type pkcs12 --ks-key-alias expenses --ks-pass env:KS_PASS --out daily-expenses.apk android/app/build/outputs/apk/debug/app-debug.apk
          "$AS" verify --print-certs daily-expenses.apk | head -3

      - uses: actions/upload-artifact@v4
        with:
          name: daily-expenses-apk
          path: daily-expenses.apk
