<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Daily Expenses</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14532d">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f3f1ea;--ink:#1d2b24;--mut:#6b7a72;--card:#fffdf7;--line:#ddd8c8;--g:#14532d;--gl:#dcefe2;--r:#b3261e;--rl:#f8dcd9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,"Times New Roman",serif;padding-bottom:72px}
header{background:var(--g);color:#fff;padding:14px 16px;font-size:19px;letter-spacing:.2px}
main{max-width:560px;margin:0 auto;padding:14px}
h3{margin:18px 0 8px;font-size:17px}
input,select,button{font:inherit;width:100%;padding:11px 12px;margin:5px 0;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
button{background:var(--g);color:#fff;border:0;font-weight:bold;cursor:pointer}
button.alt{background:#fff;color:var(--g);border:1px solid var(--g)}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.row small{display:block;color:var(--mut);font-size:13px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 8px;text-align:center}
.card small{display:block;color:var(--mut);font-size:12px}
.card b{font-size:15px;word-break:break-word}
.pos{background:var(--gl)}.neg{background:var(--rl);color:var(--r)}
.bar{height:10px;background:#e8e4d4;border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--g)}
.hint{color:var(--mut);font-size:14px}.err{color:var(--r);min-height:20px}
a{color:var(--r);cursor:pointer;padding:4px 8px;font-weight:bold}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;margin:0;border-radius:0;background:#fff;color:var(--mut);font-size:13px;padding:14px 2px}
nav button.on{color:var(--g);box-shadow:inset 0 3px 0 var(--g)}
.login{max-width:340px;margin:12vh auto;padding:20px;text-align:center}
.login h1{font-size:26px;margin-bottom:18px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const K='expenses_v1';
const DEF=['Milk','Vegetables','Fruits','Eggs','Flour','Rice','Cooking Oil','Sugar & Tea','Chicken / Meat','Groceries','Gas','Electricity Bill','Water Bill','Internet Bill','Mobile Package','Committee (Kameti)','Medicine','Transport / Fuel','School Fees','Rent','Clothes','Cigarettes'];
const LAST='Cigarettes';
let S,view='dash',authed=false,month=new Date().toISOString().slice(0,7);
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pkr=n=>'Rs '+Math.round(n).toLocaleString('en-PK');
const today=()=>new Date().toISOString().slice(0,10);
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const inM=d=>d.date.slice(0,7)===month;
const sorted=()=>[...S.items].sort((a,b)=>(a===LAST)-(b===LAST));
async function hash(p){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('exp|'+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function init(){
  try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
  if(!S){S={user:'Admin',pass:await hash('admin'),must:true,items:DEF,net:[],exp:[]};save()}
  render();
}
async function login(){
  const u=$('u').value.trim(),p=$('p').value;
  if(u.toLowerCase()===S.user.toLowerCase()&&await hash(p)===S.pass){authed=true;view=S.must?'settings':'dash';render()}
  else $('err').textContent='Wrong username or password.';
}
async function chg(){
  const u=$('nu').value.trim(),p=$('np').value;
  if(!u||p.length<4||p==='admin'){$('cerr').textContent='Enter a username and a new password (4+ characters, not "admin").';return}
  S.user=u;S.pass=await hash(p);S.must=false;save();view='dash';render();
}
function totals(){
  const net=S.net.filter(inM).reduce((a,x)=>a+x.amt,0);
  const ex=S.exp.filter(inM),spent=ex.reduce((a,x)=>a+x.amt,0),by={};
  ex.forEach(x=>by[x.item]=(by[x.item]||0)+x.amt);
  return{net,spent,rem:net-spent,by};
}
function addExp(){
  const amt=parseFloat($('ea').value),d=$('ed').value;
  if(!(amt>0)||!d){alert('Enter an amount and a date.');return}
  S.exp.push({id:Date.now(),date:d,item:$('ei').value,amt,note:$('en').value.trim()});
  month=d.slice(0,7);save();render();
}
function delExp(id){if(confirm('Delete this expense?')){S.exp=S.exp.filter(x=>x.id!==id);save();render()}}
function addNet(){
  const amt=parseFloat($('na').value),d=$('nd').value;
  if(!(amt>0)||!d){alert('Enter an amount and a date.');return}
  S.net.push({id:Date.now(),date:d,amt,note:$('nn').value.trim()});
  month=d.slice(0,7);save();render();
}
function editNet(id){
  const x=S.net.find(n=>n.id===id),v=parseFloat(prompt('New net amount (PKR):',x.amt));
  if(v>=0){x.amt=v;save();render()}
}
function delNet(id){if(confirm('Delete this net amount?')){S.net=S.net.filter(x=>x.id!==id);save();render()}}
function addItem(){
  const n=$('ni').value.trim();
  if(!n)return;
  if(S.items.some(i=>i.toLowerCase()===n.toLowerCase())){alert('Item already exists.');return}
  S.items.push(n);save();render();
}
function delItem(i){if(confirm('Remove "'+i+'" from the list? Old expenses stay.')){S.items=S.items.filter(x=>x!==i);save();render()}}
function csv(){
  const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
  const rows=[['Type','Date','Item','Amount (PKR)','Note'],...S.net.map(x=>['Net',x.date,'',x.amt,x.note]),...S.exp.map(x=>['Expense',x.date,x.item,x.amt,x.note])];
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'}));
  a.download='expenses.csv';a.click();
}
const views={
  dash(){
    const t=totals(),sp=t.net>0?t.spent/t.net*100:0,rp=t.net>0?Math.max(0,100-sp):0;
    const list=Object.entries(t.by).sort((a,b)=>b[1]-a[1]);
    return `<input type="month" value="${month}" onchange="month=this.value||month;render()">
    <div class="cards"><div class="card"><small>Net amount</small><b>${pkr(t.net)}</b></div><div class="card"><small>Spent</small><b>${pkr(t.spent)}</b></div><div class="card ${t.rem<0?'neg':'pos'}"><small>Remaining balance</small><b>${pkr(t.rem)}</b></div></div>
    <div class="box"><div class="row"><span>Spent ${sp.toFixed(1)}%</span><span>Remaining ${rp.toFixed(1)}%</span></div><div class="bar"><i style="width:${Math.min(sp,100)}%"></i></div></div>
    <h3>Main items</h3>`+(list.length?list.map(([n,v])=>{const p=v/t.spent*100;return `<div class="box"><div class="row"><span>${esc(n)}</span><span>${pkr(v)} · ${p.toFixed(1)}%</span></div><div class="bar"><i style="width:${p}%"></i></div></div>`}).join(''):'<p class="hint">No expenses this month. Add one in the Expense tab.</p>');
  },
  add(){
    const ex=S.exp.filter(inM).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
    return `<div class="box"><select id="ei">${sorted().map(i=>`<option>${esc(i)}</option>`).join('')}</select>
    <input id="ea" type="number" inputmode="decimal" placeholder="Amount (PKR)"><input id="ed" type="date" value="${today()}"><input id="en" placeholder="Note (optional)"><button onclick="addExp()">Add expense</button></div>
    <h3>Expenses in ${esc(month)}</h3>`+(ex.map(x=>`<div class="box row"><span>${esc(x.item)}<small>${x.date}${x.note?' · '+esc(x.note):''}</small></span><span>${pkr(x.amt)}<a onclick="delExp(${x.id})">✕</a></span></div>`).join('')||'<p class="hint">Nothing added yet.</p>');
  },
  net(){
    const l=S.net.filter(inM).sort((a,b)=>b.date.localeCompare(a.date));
    return `<div class="box"><input id="na" type="number" inputmode="decimal" placeholder="Net amount (PKR)"><input id="nd" type="date" value="${today()}"><input id="nn" placeholder="Note (optional, e.g. Salary)"><button onclick="addNet()">Save net amount</button></div>
    <h3>Net amounts in ${esc(month)}</h3>`+(l.map(x=>`<div class="box row"><span>${pkr(x.amt)}<small>${x.date}${x.note?' · '+esc(x.note):''}</small></span><span><a onclick="editNet(${x.id})" style="color:var(--g)">Edit</a><a onclick="delNet(${x.id})">✕</a></span></div>`).join('')||'<p class="hint">No net amount for this month yet.</p>');
  },
  items(){
    return `<div class="box row"><input id="ni" placeholder="New item name" style="margin:0"><button onclick="addItem()" style="width:auto;margin:0">Add</button></div>`+
    sorted().map(i=>`<div class="box row"><span>${esc(i)}</span><a onclick="delItem(decodeURIComponent('${encodeURIComponent(i)}'))">✕</a></div>`).join('');
  },
  settings(){
    return (S.must?'<p class="box" style="background:var(--rl)">Choose your own username and password before you continue.</p>':'')+
    `<h3>Change login</h3><div class="box"><input id="nu" value="${esc(S.user)}" placeholder="New username" autocapitalize="off"><input id="np" type="password" placeholder="New password"><button onclick="chg()">Save login</button><p id="cerr" class="err"></p></div>`+
    (S.must?'':`<h3>Data</h3><button class="alt" onclick="csv()">Export CSV</button><button class="alt" onclick="authed=false;render()">Log out</button>`);
  }
};
function render(){
  const a=$('app');
  if(!authed){
    a.innerHTML=`<div class="login"><h1>Daily Expenses</h1><input id="u" placeholder="Username" autocapitalize="off"><input id="p" type="password" placeholder="Password"><button onclick="login()">Log in</button><p id="err" class="err"></p></div>`;
    $('p').onkeydown=e=>{if(e.key==='Enter')login()};return;
  }
  if(S.must)view='settings';
  const tabs=[['dash','Dashboard'],['add','Expense'],['net','Net'],['items','Items'],['settings','Settings']];
  a.innerHTML=`<header>Daily Expenses</header><main>${views[view]()}</main>`+(S.must?'':`<nav>${tabs.map(t=>`<button class="${view===t[0]?'on':''}" onclick="view='${t[0]}';render()">${t[1]}</button>`).join('')}</nav>`);
}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
init();
</script>
</body>
</html>
