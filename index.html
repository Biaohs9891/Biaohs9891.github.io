<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Daily Expenses | روزانہ اخراجات</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14532d">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f3f1ea;--ink:#1d2b24;--mut:#6b7a72;--card:#fffdf7;--line:#ddd8c8;--g:#14532d;--gl:#dcefe2;--r:#b3261e;--rl:#f8dcd9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.7 "Noto Naskh Arabic",Tahoma,system-ui,sans-serif;padding-bottom:76px}
header{background:var(--g);color:#fff;padding:10px 16px;font-size:20px;display:flex;justify-content:space-between;align-items:center}
header button{width:auto;margin:0;padding:4px 14px;background:#fff;color:var(--g)}
main{max-width:560px;margin:0 auto;padding:14px}
h3{margin:18px 0 8px;font-size:18px}
input,select,button{font:inherit;width:100%;padding:9px 12px;margin:5px 0;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
button{background:var(--g);color:#fff;border:0;font-weight:bold;cursor:pointer}
button.alt{background:#fff;color:var(--g);border:1px solid var(--g)}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:8px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.row small{display:block;color:var(--mut);font-size:14px;line-height:1.5}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center}
.card small{display:block;color:var(--mut);font-size:13px;line-height:1.5}
.card b{font-size:15px;word-break:break-word}
.pos{background:var(--gl)}.neg{background:var(--rl);color:var(--r)}
.bar{height:10px;background:#e8e4d4;border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--g)}
.hint{color:var(--mut);font-size:15px}.err{color:var(--r);min-height:20px}
a{color:var(--r);cursor:pointer;padding:4px 8px;font-weight:bold}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;margin:0;border-radius:0;background:#fff;color:var(--mut);font-size:14px;padding:12px 2px}
nav button.on{color:var(--g);box-shadow:inset 0 3px 0 var(--g)}
.login{max-width:340px;margin:12vh auto;padding:20px;text-align:center}
.login h1{font-size:28px;margin-bottom:18px}
#u,#p,#nu,#np{direction:ltr}
</style>
</head>
<body>
<div id="app"></div>
<script>
const K='expenses_bi_v1',LK='expenses_lang';
const DEF=['Milk','Vegetables','Fruits','Eggs','Flour','Rice','Cooking Oil','Sugar & Tea','Chicken / Meat','Groceries','Gas','Electricity Bill','Water Bill','Internet Bill','Mobile Package','Committee (Kameti)','Medicine','Transport / Fuel','School Fees','Rent','Clothes','Cigarettes'];
const UR=['دودھ','سبزی','پھل','انڈے','آٹا','چاول','کوکنگ آئل','چینی اور چائے','گوشت / مرغی','راشن / گروسری','گیس','بجلی کا بل','پانی کا بل','انٹرنیٹ بل','موبائل پیکج','کمیٹی','دوائی','سفر / پیٹرول','اسکول فیس','مکان کا کرایہ','کپڑے','سگریٹ'];
const LAST='Cigarettes';
const L={
en:{title:'Daily Expenses',user:'Username',pass:'Password',login:'Log in',wrong:'Wrong username or password.',tabs:['Dashboard','Expense','Net','Items','Settings'],net:'Net amount',spent:'Spent',rem:'Remaining balance',spp:'Spent',rmp:'Remaining',main:'Main items',none:'No expenses this month. Add one in the Expense tab.',amt:'Amount (PKR)',note:'Note (optional)',addexp:'Add expense',expin:m=>'Expenses in '+m,nothing:'Nothing added yet.',netnote:'Note (e.g. Salary)',savenet:'Save net amount',netin:m=>'Net amounts in '+m,nonet:'No net amount for this month yet.',edit:'Edit',newitem:'New item name',add:'Add',chg:'Change login',nu:'New username',np:'New password',save:'Save login',must:'Choose your own username and password before you continue.',cerr:'Enter a username and a new password (4+ characters, not "admin").',data:'Data',csv:'Export CSV',out:'Log out',need:'Enter an amount and a date.',dexp:'Delete this expense?',dnet:'Delete this net amount?',pnet:'New net amount (PKR):',exists:'Item already exists.',ditem:i=>'Remove "'+i+'" from the list? Old expenses stay.',cols:['Type','Date','Item','Amount (PKR)','Note'],tn:'Net',te:'Expense',cur:n=>'Rs '+n,other:'اردو'},
ur:{title:'روزانہ اخراجات',user:'صارف نام',pass:'پاس ورڈ',login:'لاگ اِن',wrong:'صارف نام یا پاس ورڈ غلط ہے۔',tabs:['ڈیش بورڈ','خرچہ','نیٹ رقم','اشیاء','ترتیبات'],net:'نیٹ رقم',spent:'کل خرچ',rem:'بقایا رقم',spp:'خرچ',rmp:'بقایا',main:'اہم اشیاء',none:'اس مہینے کوئی خرچہ نہیں۔ "خرچہ" ٹیب میں شامل کریں۔',amt:'رقم (روپے)',note:'نوٹ (اختیاری)',addexp:'خرچہ شامل کریں',expin:m=>m+' کے اخراجات',nothing:'ابھی کچھ شامل نہیں۔',netnote:'نوٹ (مثلاً تنخواہ)',savenet:'نیٹ رقم محفوظ کریں',netin:m=>m+' کی نیٹ رقم',nonet:'اس مہینے کی کوئی نیٹ رقم نہیں۔',edit:'ترمیم',newitem:'نئی چیز کا نام',add:'شامل کریں',chg:'لاگ اِن تبدیل کریں',nu:'نیا صارف نام',np:'نیا پاس ورڈ',save:'محفوظ کریں',must:'جاری رکھنے سے پہلے اپنا صارف نام اور پاس ورڈ منتخب کریں۔',cerr:'نیا صارف نام اور پاس ورڈ درج کریں (کم از کم 4 حروف، "admin" نہیں)۔',data:'ڈیٹا',csv:'CSV ایکسپورٹ',out:'لاگ آؤٹ',need:'رقم اور تاریخ درج کریں۔',dexp:'یہ خرچہ حذف کریں؟',dnet:'یہ نیٹ رقم حذف کریں؟',pnet:'نئی نیٹ رقم (روپے):',exists:'یہ چیز پہلے سے موجود ہے۔',ditem:i=>'فہرست سے "'+i+'" ہٹائیں؟ پرانے خرچے محفوظ رہیں گے۔',cols:['قسم','تاریخ','چیز','رقم (روپے)','نوٹ'],tn:'نیٹ رقم',te:'خرچہ',cur:n=>n+' روپے',other:'English'}
};
let S,lang=localStorage.getItem(LK)||'en',view='dash',authed=false,month=new Date().toISOString().slice(0,7);
const t=k=>L[lang][k];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nm=i=>lang==='ur'&&DEF.includes(i)?UR[DEF.indexOf(i)]:i;
const pkr=n=>t('cur')('<bdi>'+Math.round(n).toLocaleString('en-US')+'</bdi>');
const today=()=>new Date().toISOString().slice(0,10);
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const inM=d=>d.date.slice(0,7)===month;
const sorted=()=>[...S.items].sort((a,b)=>(a===LAST)-(b===LAST));
function setLang(){lang=lang==='ur'?'en':'ur';try{localStorage.setItem(LK,lang)}catch(e){}render()}
async function hash(p){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('exp|'+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function init(){
  try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
  if(!S){S={user:'Admin',pass:await hash('admin'),must:true,items:DEF,net:[],exp:[]};save()}
  render();
}
async function login(){
  const u=$('u').value.trim(),p=$('p').value;
  if(u.toLowerCase()===S.user.toLowerCase()&&await hash(p)===S.pass){authed=true;view=S.must?'settings':'dash';render()}
  else $('err').textContent=t('wrong');
}
async function chg(){
  const u=$('nu').value.trim(),p=$('np').value;
  if(!u||p.length<4||p==='admin'){$('cerr').textContent=t('cerr');return}
  S.user=u;S.pass=await hash(p);S.must=false;save();view='dash';render();
}
function totals(){
  const net=S.net.filter(inM).reduce((a,x)=>a+x.amt,0);
  const ex=S.exp.filter(inM),spent=ex.reduce((a,x)=>a+x.amt,0),by={};
  ex.forEach(x=>by[x.item]=(by[x.item]||0)+x.amt);
  return{net,spent,rem:net-spent,by};
}
function addExp(){
  const amt=parseFloat($('ea').value),d=$('ed').value;
  if(!(amt>0)||!d){alert(t('need'));return}
  S.exp.push({id:Date.now(),date:d,item:$('ei').value,amt,note:$('en').value.trim()});
  month=d.slice(0,7);save();render();
}
function delExp(id){if(confirm(t('dexp'))){S.exp=S.exp.filter(x=>x.id!==id);save();render()}}
function addNet(){
  const amt=parseFloat($('na').value),d=$('nd').value;
  if(!(amt>0)||!d){alert(t('need'));return}
  S.net.push({id:Date.now(),date:d,amt,note:$('nn').value.trim()});
  month=d.slice(0,7);save();render();
}
function editNet(id){
  const x=S.net.find(n=>n.id===id),v=parseFloat(prompt(t('pnet'),x.amt));
  if(v>=0){x.amt=v;save();render()}
}
function delNet(id){if(confirm(t('dnet'))){S.net=S.net.filter(x=>x.id!==id);save();render()}}
function addItem(){
  const n=$('ni').value.trim();
  if(!n)return;
  if(S.items.some(i=>i.toLowerCase()===n.toLowerCase()||nm(i)===n)){alert(t('exists'));return}
  S.items.push(n);save();render();
}
function delItem(i){if(confirm(t('ditem')(nm(i)))){S.items=S.items.filter(x=>x!==i);save();render()}}
function csv(){
  const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
  const rows=[t('cols'),...S.net.map(x=>[t('tn'),x.date,'',x.amt,x.note]),...S.exp.map(x=>[t('te'),x.date,nm(x.item),x.amt,x.note])];
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv;charset=utf-8'}));
  a.download='expenses.csv';a.click();
}
const views={
  dash(){
    const x=totals(),sp=x.net>0?x.spent/x.net*100:0,rp=x.net>0?Math.max(0,100-sp):0;
    const list=Object.entries(x.by).sort((a,b)=>b[1]-a[1]);
    return `<input type="month" value="${month}" onchange="month=this.value||month;render()">
    <div class="cards"><div class="card"><small>${t('net')}</small><b>${pkr(x.net)}</b></div><div class="card"><small>${t('spent')}</small><b>${pkr(x.spent)}</b></div><div class="card ${x.rem<0?'neg':'pos'}"><small>${t('rem')}</small><b>${pkr(x.rem)}</b></div></div>
    <div class="box"><div class="row"><span>${t('spp')} ${sp.toFixed(1)}%</span><span>${t('rmp')} ${rp.toFixed(1)}%</span></div><div class="bar"><i style="width:${Math.min(sp,100)}%"></i></div></div>
    <h3>${t('main')}</h3>`+(list.length?list.map(([n,v])=>{const p=v/x.spent*100;return `<div class="box"><div class="row"><span>${esc(nm(n))}</span><span>${pkr(v)} · ${p.toFixed(1)}%</span></div><div class="bar"><i style="width:${p}%"></i></div></div>`}).join(''):`<p class="hint">${t('none')}</p>`);
  },
  add(){
    const ex=S.exp.filter(inM).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
    return `<div class="box"><select id="ei">${sorted().map(i=>`<option value="${esc(i)}">${esc(nm(i))}</option>`).join('')}</select>
    <input id="ea" type="number" inputmode="decimal" placeholder="${t('amt')}"><input id="ed" type="date" value="${today()}"><input id="en" placeholder="${t('note')}"><button onclick="addExp()">${t('addexp')}</button></div>
    <h3>${esc(t('expin')(month))}</h3>`+(ex.map(x=>`<div class="box row"><span>${esc(nm(x.item))}<small>${x.date}${x.note?' · '+esc(x.note):''}</small></span><span>${pkr(x.amt)}<a onclick="delExp(${x.id})">✕</a></span></div>`).join('')||`<p class="hint">${t('nothing')}</p>`);
  },
  net(){
    const l=S.net.filter(inM).sort((a,b)=>b.date.localeCompare(a.date));
    return `<div class="box"><input id="na" type="number" inputmode="decimal" placeholder="${t('net')} (PKR)"><input id="nd" type="date" value="${today()}"><input id="nn" placeholder="${t('netnote')}"><button onclick="addNet()">${t('savenet')}</button></div>
    <h3>${esc(t('netin')(month))}</h3>`+(l.map(x=>`<div class="box row"><span>${pkr(x.amt)}<small>${x.date}${x.note?' · '+esc(x.note):''}</small></span><span><a onclick="editNet(${x.id})" style="color:var(--g)">${t('edit')}</a><a onclick="delNet(${x.id})">✕</a></span></div>`).join('')||`<p class="hint">${t('nonet')}</p>`);
  },
  items(){
    return `<div class="box row"><input id="ni" placeholder="${t('newitem')}" style="margin:0"><button onclick="addItem()" style="width:auto;margin:0">${t('add')}</button></div>`+
    sorted().map(i=>`<div class="box row"><span>${esc(nm(i))}</span><a onclick="delItem(decodeURIComponent('${encodeURIComponent(i)}'))">✕</a></div>`).join('');
  },
  settings(){
    return (S.must?`<p class="box" style="background:var(--rl)">${t('must')}</p>`:'')+
    `<h3>${t('chg')}</h3><div class="box"><input id="nu" value="${esc(S.user)}" placeholder="${t('nu')}" autocapitalize="off"><input id="np" type="password" placeholder="${t('np')}"><button onclick="chg()">${t('save')}</button><p id="cerr" class="err"></p></div>`+
    (S.must?'':`<h3>${t('data')}</h3><button class="alt" onclick="csv()">${t('csv')}</button><button class="alt" onclick="authed=false;render()">${t('out')}</button>`);
  }
};
function render(){
  const a=$('app'),h=document.documentElement;
  h.lang=lang;h.dir=lang==='ur'?'rtl':'ltr';document.title=t('title');
  const lb=`<button class="alt" onclick="setLang()">${t('other')}</button>`;
  if(!authed){
    a.innerHTML=`<div class="login"><h1>${t('title')}</h1><input id="u" placeholder="${t('user')}" autocapitalize="off"><input id="p" type="password" placeholder="${t('pass')}"><button onclick="login()">${t('login')}</button><p id="err" class="err"></p>${lb}</div>`;
    $('p').onkeydown=e=>{if(e.key==='Enter')login()};return;
  }
  if(S.must)view='settings';
  const ids=['dash','add','net','items','settings'];
  a.innerHTML=`<header><span>${t('title')}</span>${lb}</header><main>${views[view]()}</main>`+(S.must?'':`<nav>${ids.map((id,n)=>`<button class="${view===id?'on':''}" onclick="view='${id}';render()">${t('tabs')[n]}</button>`).join('')}</nav>`);
}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
init();
</script>
</body>
</html>
